name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    name: Claude Code
    runs-on: ubuntu-latest

    # Only run on @claude mentions (or new issues/PRs with @claude in body)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@claude'))

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude reads CLAUDE.md automatically — project rules are applied
          # Examples of what to say in PR/issue comments:
          #   @claude why is this test failing?
          #   @claude add @functional tests for the pricing page
          #   @claude update selectors in navigation.page.ts after the redesign
          #   @claude run /analyze-site and update site.config.json
          #   @claude run /generate-full-suite for the new features page
